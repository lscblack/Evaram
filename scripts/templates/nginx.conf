# nginx site for the Evaramu platform (copy to /etc/nginx/sites-available/evaramu,
# adjust server_name and the paths, then `nginx -t && systemctl reload nginx`).
# Obtain TLS with certbot: `certbot --nginx -d rent.example.com`.

upstream evaramu_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name rent.example.com;

    # Built frontend (scripts/build.sh swaps this directory atomically).
    root /srv/evaramu/client/dist;
    index index.html;

    client_max_body_size 25m;   # up to 20 photos per upload request (MAX_UPLOAD_MB each)

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://evaramu_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Public property photographs. Served straight from MEDIA_ROOT; payment
    # evidence lives in PRIVATE_ROOT and is never exposed here.
    location /media/ {
        alias /srv/evaramu/server/storage/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        types { image/webp webp; }
        default_type application/octet-stream;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: everything else falls back to index.html (never cached,
    # so a new deployment is picked up immediately).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
